# Opção Docker com Django + PHP no mesmo serviço. Ver docs/indicadores-php.md.
# O render.yaml existente continua disponível para o serviço Python atual.
services:
  - type: web
    name: mkpause-com-indicadores
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/auth/csrf/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEMO_SENHA
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false # endereço público do serviço, usado nos links de convite (ex.: https://mkpause.onrender.com)
      - key: INDICADORES_DATABASE_URL
        sync: false # opcional: URL do Neon SEM pooler (DATABASE_URL_UNPOOLED) só para o PHP; vazio usa DATABASE_URL
