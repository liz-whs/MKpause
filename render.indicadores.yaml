# MKpause no Render: Docker com Nginx + PHP-FPM (backend Laravel, indicadores) e a interface web.
# O banco fica fora (Neon). Passo a passo em docs/hospedagem.md.
services:
  - type: web
    name: mkpause-com-indicadores
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/auth/csrf/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEMO_SENHA
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false # endereço público do serviço, usado nos links de convite (ex.: https://mkpause.onrender.com)
      - key: INDICADORES_DATABASE_URL
        sync: false # opcional: URL do Neon SEM pooler (DATABASE_URL_UNPOOLED) só para o PHP; vazio usa DATABASE_URL
