pid /tmp/mkpause-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/mkpause-body;
    proxy_temp_path /tmp/mkpause-proxy;
    fastcgi_temp_path /tmp/mkpause-fastcgi;
    # O Nginx cria todas as pastas temporárias ao iniciar; as padrão ficam em
    # /var/lib/nginx, onde o usuário app não escreve.
    uwsgi_temp_path /tmp/mkpause-uwsgi;
    scgi_temp_path /tmp/mkpause-scgi;
    server {
        listen __PORT__;
        server_name _;
        root /app/src/web/dist;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        # Medir scripts/conexões de jogos e VLibras antes de restringir a execução.
        # Os jogos (pygbag) baixam o Python para WebAssembly de pygame-web.github.io: sem ele, a política os bloquearia.
        # O VLibras (vlibras.gov.br) carrega script, imagens e o avatar do próprio site.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://pygame-web.github.io https://vlibras.gov.br; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://vlibras.gov.br; media-src 'self' blob:; connect-src 'self' https://pygame-web.github.io https://vlibras.gov.br; frame-src 'self' https://pygame-web.github.io; worker-src 'self' blob:" always;
        location ~ /\. { return 404; }

        # API: backend Laravel.
        location /api/ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 30s;
        }

        # Indicadores agregados da escola (módulo PHP separado).
        location /indicadores/ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/src/indicadores/public/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 20s;
        }

        # O pygbag descompacta o pacote no navegador; não remover a compressão antes.
        location ~ ^/jogos/.*\.tar\.gz$ {
            default_type application/octet-stream;
            gzip off;
            try_files $uri =404;
        }

        # Interface web: arquivos compilados; as rotas do React caem no index.html.
        location / {
            try_files $uri /index.html;
        }
    }
}
