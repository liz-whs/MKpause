<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MK Potion</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4ece6; color: #4f4647; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .jogo { position: relative; width: 100%; aspect-ratio: 1000 / 700; background: #4f4647;
          border-radius: 14px; overflow: hidden; }
  .jogo iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  @media (max-width: 700px) { .jogo { aspect-ratio: auto; height: 80vh; } }
</style>
</head>
<body>
<main>
  <h1>MK Potion</h1>
  <div class="jogo">
    <iframe src="jogo/index.html" title="MK Potion" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>
</main>
</body>
</html>
